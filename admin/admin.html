<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Channel Admin — local only</title>
<!--
  LOCAL ADMIN DASHBOARD — run with:  npm run admin   (node admin/serve.js)
  Visit: http://127.0.0.1:8787/admin/admin.html

  Security model:
   · This page is NEVER linked from the public index.html and carries no secrets.
     Even if a visitor downloads it from GitHub, it does nothing without a token.
   · Your fine-grained PAT lives ONLY in this browser's localStorage on YOUR
     machine (origin 127.0.0.1 — completely separate from your GitHub Pages
     origin, so the public site can never read it).
   · All GitHub API calls go directly from your browser to api.github.com.
-->
<style>
  :root { --bg:#09080a; --panel:#121014; --line:#2b262d; --gold:#d4af37; --text:#ece6d6; --dim:#8a838f; --red:#e5484d; --green:#46a758; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 Barlow,system-ui,sans-serif; display:flex; justify-content:center; padding:24px 14px; }
  main { width:min(760px,100%); }
  h1 { font-size:22px; margin:0 0 2px; color:var(--gold); letter-spacing:.02em; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin:0 0 10px; color:var(--gold); font-weight:600; }
  label { display:block; font-size:12px; color:var(--dim); margin:10px 0 4px; }
  input, select { width:100%; background:#0c0b0e; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:9px 11px; font:14px Barlow,system-ui,sans-serif; }
  input:focus, select:focus { outline:2px solid var(--gold); outline-offset:1px; border-color:transparent; }
  button { font:600 14px Barlow,system-ui,sans-serif; color:#09080a; background:var(--gold); border:0; border-radius:5px; padding:10px 18px; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  button.ghost { background:transparent; color:var(--gold); border:1px solid var(--line); }
  button.danger { background:transparent; color:var(--red); border:1px solid var(--line); padding:6px 12px; font-size:13px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:14px; }
  .status { font-size:13px; min-height:18px; margin-top:8px; }
  .ok { color:var(--green); } .err { color:var(--red); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  td.name { width:40%; } td.file { color:var(--dim); font-size:12px; word-break:break-all; }
  tr:last-child td { border-bottom:0; }
  .pill { display:inline-block; font-size:11px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--dim); }
  .hidden { display:none; }
  .cfg { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  code { color:var(--gold); }
  #tokenRow .row { margin-top:6px; }
</style>
</head>
<body>
<main>
  <h1>⚙ Channel Admin</h1>
  <div class="sub">Local-only control panel. Token stays in <b>this browser</b> (localStorage on 127.0.0.1). Nothing here is ever sent anywhere except <code>api.github.com</code>.</div>

  <!-- 1 ── REPO + TOKEN -->
  <section class="card" id="tokenCard">
    <h2>1 · Connection</h2>
    <div class="cfg">
      <div><label for="owner">GitHub owner</label><input id="owner" placeholder="sam15x7"></div>
      <div><label for="repo">Repository</label><input id="repo" placeholder="my-channels"></div>
      <div><label for="branch">Branch</label><input id="branch" value="main"></div>
    </div>
    <div id="tokenRow">
      <label for="token">Fine-grained PAT (Contents: Read &amp; write, this repo only)</label>
      <input id="token" type="password" placeholder="github_pat_..." autocomplete="off">
      <div class="row">
        <button id="saveToken">Save token (local only)</button>
        <button class="ghost" id="forgetToken">Forget token</button>
        <span class="pill" id="tokenState">no token stored</span>
      </div>
    </div>
    <div class="status" id="connStatus"></div>
  </section>

  <!-- 2 ── ADD CHANNEL (the old click-and-paste flow) -->
  <section class="card hidden" id="addCard">
    <h2>2 · Add channel</h2>
    <label for="chName">Display name — e.g. ESPN 4 (Argentina)</label>
    <input id="chName" placeholder="ESPN 4 (Argentina)">
    <label for="chUrl">Stream URL (iframe src) — just paste it</label>
    <input id="chUrl" placeholder="https://dlive.sx/cast/stream-900.php">
    <details style="margin-top:10px"><summary style="font-size:12px;color:var(--dim);cursor:pointer">Advanced (file name / tab title / preview)</summary>
      <div class="cfg">
        <div><label for="chFile">File name (auto from name)</label><input id="chFile" placeholder="espn4argentina.html"></div>
        <div><label for="chTitle">Page title (defaults to name)</label><input id="chTitle"></div>
      </div>
      <div class="row"><button class="ghost" id="previewBtn" type="button">Preview page →</button></div>
    </details>
    <div class="row"><button id="addBtn">＋ Add channel &amp; publish</button></div>
    <div class="status" id="addStatus"></div>
  </section>

  <!-- 3 ── MANAGE -->
  <section class="card hidden" id="listCard">
    <h2>3 · Channels <span class="pill" id="count"></span></h2>
    <table><tbody id="list"></tbody></table>
    <div class="row"><button class="ghost" id="refreshBtn">↻ Refresh from GitHub</button></div>
    <div class="status" id="listStatus"></div>
  </section>
</main>

<script>
'use strict';

/* ---------- tiny helpers ---------- */
const $ = id => document.getElementById(id);
const LS_TOKEN = 'channeladmin.token', LS_CFG = 'channeladmin.cfg';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function slug(raw) {
  return String(raw || '').trim().replace(/\.html?$/i, '').replace(/\s+/g, '')
    .replace(/[^A-Za-z0-9._()-]/g, '').toLowerCase();
}
function pretty(fileName) {
  const base = fileName.replace(/\.html$/i, '');
  let out = base.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/([A-Za-z])(\d)/g, '$1 $2')
    .replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim();
  return out.charAt(0).toUpperCase() + out.slice(1);
}
function setStatus(el, msg, cls) { el.className = 'status ' + (cls || ''); el.textContent = msg || ''; }

function cfg() {
  return { owner: $('owner').value.trim(), repo: $('repo').value.trim(), branch: $('branch').value.trim() || 'main' };
}
function token() { return localStorage.getItem(LS_TOKEN) || ''; }

async function gh(pathname, opts = {}) {
  const c = cfg();
  const r = await fetch('https://api.github.com/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo) + pathname, {
    method: opts.method || 'GET',
    headers: {
      'Authorization': 'Bearer ' + token(),
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(opts.body ? { 'Content-Type': 'application/json' } : {})
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (!r.ok) {
    let detail = ''; try { detail = (await r.json()).message; } catch (_) {}
    throw new Error('GitHub ' + r.status + (detail ? ': ' + detail : ''));
  }
  return r.status === 204 ? null : r.json();
}

/* ---------- template mirror of template.html (structure unchanged!) ----------
   Keep this byte-identical to template.html placeholders {{TITLE}}/{{STREAM_URL}}.
   The canonical copy is fetched from the repo at load; this is the fallback. */
const FALLBACK_TEMPLATE = null; // always fetch real template from GitHub — safer

/* ---------- state ---------- */
let TEMPLATE = null;      // template.html text (fetched from repo)
let INDEX_HTML = null;    // index.html text
let CHANNELS = [];        // [{file,name}]
let SHA = {};             // path -> sha per commit batch

async function loadAll() {
  setStatus($('connStatus'), 'Loading repo files…');
  const [tpl, idx, ch] = await Promise.all([
    gh('/contents/template.html?ref=' + encodeURIComponent(cfg().branch)),
    gh('/contents/index.html?ref=' + encodeURIComponent(cfg().branch)),
    gh('/contents/channels.json?ref=' + encodeURIComponent(cfg().branch))
  ]);
  TEMPLATE = b64(tpl.content); SHA['template.html'] = tpl.sha;
  INDEX_HTML = b64(idx.content); SHA['index.html'] = idx.sha;
  const data = JSON.parse(b64(ch.content)); SHA['channels.json'] = ch.sha;
  CHANNELS = data.channels || [];
  $('count').textContent = CHANNELS.length + ' channels';
  renderList();
  setStatus($('connStatus'), 'Connected ✓ (' + cfg().owner + '/' + cfg().repo + '@' + cfg().branch + ')', 'ok');
  $('addCard').classList.remove('hidden');
  $('listCard').classList.remove('hidden');
  return data;
}
const b64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0)));

function renderList() {
  const tb = $('list'); tb.innerHTML = '';
  for (const c of [...CHANNELS].sort((a, b) => a.name.localeCompare(b.name))) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="name">' + esc(c.name) + '</td>' +
      '<td class="file">' + esc(c.file) + '</td>' +
      '<td style="text-align:right"><button class="danger" data-file="' + esc(c.file) + '">Remove</button></td>';
    tr.querySelector('button').onclick = () => removeChannel(c);
    tb.appendChild(tr);
  }
}

/* ---------- index regeneration (byte-identical rules to admin/lib.js) ---------- */
const sortKey = c => String(c.name).toLowerCase();
function buildIndexLinks() {
  const sorted = [...CHANNELS].sort((a, b) => (sortKey(a) < sortKey(b) ? -1 : sortKey(a) > sortKey(b) ? 1 : 0));
  return '\n' + sorted.map(c => '  <a href="' + encodeURI(c.file) + '">' + esc(c.name) + '</a>').join('\n') + '\n';
}
function regenerateIndex() {
  const marker = '<nav class="grid" id="channels" aria-label="Channel list">';
  const start = INDEX_HTML.indexOf(marker);
  if (start === -1) throw new Error('index.html nav marker not found — run admin/sync-index.js once from CLI.');
  const bodyStart = INDEX_HTML.indexOf('>', start) + 1;
  const end = INDEX_HTML.indexOf('</nav>', bodyStart);
  INDEX_HTML = INDEX_HTML.slice(0, bodyStart) + buildIndexLinks() + INDEX_HTML.slice(end);
}

/* ---------- commit one file (GitHub Contents API PUT — replaces the file) ---------- */
async function commitFile(filePath, content, message) {
  const body = { message, content: b64enc(content), branch: cfg().branch };
  try {
    const cur = await gh('/contents/' + encodeURIComponent(filePath) + '?ref=' + encodeURIComponent(cfg().branch));
    if (cur && cur.sha) body.sha = cur.sha;   // existing file → update it
  } catch (e) {
    if (!/GitHub 404/.test(e.message)) throw e;  // 404 = new file, fine
  }
  return gh('/contents/' + encodeURIComponent(filePath), { method: 'PUT', body });
}
const b64enc = s => btoa(unescape(encodeURIComponent(s)));

/* ---------- add channel ---------- */
async function addChannel() {
  const name = $('chName').value.trim();
  const url = $('chUrl').value.trim();
  if (!name) return setStatus($('addStatus'), 'Enter a display name.', 'err');
  if (!/^https?:\/\/.+/i.test(url)) return setStatus($('addStatus'), 'Paste a full stream URL starting with https://', 'err');

  let file = slug($('chFile').value || name);
  if (!file) return setStatus($('addStatus'), 'Could not derive a file name.', 'err');
  file += '.html';
  if (/^(index|template|new)\.html$/i.test(file)) return setStatus($('addStatus'), 'That file name is reserved.', 'err');

  const title = $('chTitle').value.trim() || name;
  $('addBtn').disabled = true;
  setStatus($('addStatus'), 'Publishing ' + file + ' …');
  try {
    const page = TEMPLATE.replace('{{TITLE}}', esc(title)).replace('{{STREAM_URL}}', url);
    // 1) channel page
    await commitFile(file, page, 'Add channel: ' + name);
    // 2) channels.json
    const exists = CHANNELS.find(c => c.file.toLowerCase() === file.toLowerCase());
    if (exists) exists.name = name; else CHANNELS.push({ file, name });
    const data = { owner: cfg().owner, repo: cfg().repo, branch: cfg().branch, channels: CHANNELS };
    await commitFile('channels.json', JSON.stringify(data, null, 2) + '\n', 'Register channel: ' + name);
    // 3) index.html
    regenerateIndex();
    await commitFile('index.html', INDEX_HTML, 'Update index: ' + name);

    setStatus($('addStatus'), '✔ "' + name + '" is live — GitHub Pages redeploys in ~30–60 s.', 'ok');
    $('chName').value = ''; $('chUrl').value = ''; $('chFile').value = ''; $('chTitle').value = '';
    renderList(); $('count').textContent = CHANNELS.length + ' channels';
  } catch (e) {
    setStatus($('addStatus'), '✗ ' + e.message, 'err');
  } finally {
    $('addBtn').disabled = false;
  }
}

/* ---------- remove channel ---------- */
async function removeChannel(c) {
  if (!confirm('Remove "' + c.name + '" (' + c.file + ')?\nThe page file stays on GitHub but disappears from index.html.\nDelete it manually via github.com/repo/.../delete this file if you want it gone entirely.')) return;
  setStatus($('listStatus'), 'Removing …');
  try {
    CHANNELS = CHANNELS.filter(x => x.file !== c.file);
    const data = { owner: cfg().owner, repo: cfg().repo, branch: cfg().branch, channels: CHANNELS };
    await commitFile('channels.json', JSON.stringify(data, null, 2) + '\n', 'Remove channel: ' + c.name);
    regenerateIndex();
    await commitFile('index.html', INDEX_HTML, 'Update index: removed ' + c.name);
    renderList(); $('count').textContent = CHANNELS.length + ' channels';
    setStatus($('listStatus'), '✔ Removed ' + c.name, 'ok');
  } catch (e) { setStatus($('listStatus'), '✗ ' + e.message, 'err'); }
}

/* ---------- preview built page in a new tab (blob, nothing uploaded) ---------- */
function preview() {
  const url = $('chUrl').value.trim() || 'https://dlive.sx/cast/stream-885.php';
  const title = $('chTitle').value.trim() || $('chName').value.trim() || 'Live';
  if (!TEMPLATE) return alert('Template not loaded yet — save token first.');
  const page = TEMPLATE.replace('{{TITLE}}', esc(title)).replace('{{STREAM_URL}}', url);
  window.open(URL.createObjectURL(new Blob([page], { type: 'text/html' })), '_blank');
}

/* ---------- connection / token management ---------- */
function refreshTokenState() {
  const has = !!token();
  $('tokenState').textContent = has ? 'token stored in this browser ✓' : 'no token stored';
  $('token').value = '';
  return has;
}
$('saveToken').onclick = () => {
  const t = $('token').value.trim();
  if (!t) return setStatus($('connStatus'), 'Paste the token first.', 'err');
  if (!/^github_pat_|^ghp_/.test(t)) return setStatus($('connStatus'), 'Does not look like a GitHub PAT (github_pat_…).', 'err');
  localStorage.setItem(LS_TOKEN, t);
  localStorage.setItem(LS_CFG, JSON.stringify(cfg()));
  refreshTokenState();
  loadAll().catch(e => setStatus($('connStatus'), '✗ ' + e.message + ' — check owner/repo/token.', 'err'));
};
$('forgetToken').onclick = () => { localStorage.removeItem(LS_TOKEN); refreshTokenState(); location.reload(); };
$('addBtn').onclick = addChannel;
$('previewBtn').onclick = preview;
$('refreshBtn').onclick = () => loadAll().catch(e => setStatus($('listStatus'), '✗ ' + e.message, 'err'));
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !$('addCard').classList.contains('hidden') &&
      (e.target === $('chName') || e.target === $('chUrl'))) addChannel();
});

/* ---------- boot: restore saved config ---------- */
(async function boot() {
  try { const saved = JSON.parse(localStorage.getItem(LS_CFG) || '{}');
    if (saved.owner) $('owner').value = saved.owner;
    if (saved.repo) $('repo').value = saved.repo;
    if (saved.branch) $('branch').value = saved.branch;
  } catch (_) {}

  // No repo typed yet? Try to pre-fill from the local channels.json served by admin/serve.js.
  if (!$('owner').value || !$('repo').value) {
    try {
      const r = await fetch('/channels.json');
      if (r.ok) {
        const j = await r.json();
        if (j.owner && !$('owner').value) $('owner').value = j.owner;
        if (j.repo && !$('repo').value) $('repo').value = j.repo;
        if (j.branch && $('branch').value === 'main') $('branch').value = j.branch;
      }
    } catch (_) { /* fine — fill manually */ }
  }

  if (refreshTokenState() && $('owner').value && $('repo').value) {
    loadAll().catch(e => setStatus($('connStatus'), '✗ ' + e.message, 'err'));
  } else {
    setStatus($('connStatus'), 'Fill owner/repo, paste your fine-grained token, then Save.');
  }
})();
</script>
</body>
</html>
