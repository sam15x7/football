<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- Watermark settings (centered) ---------- */
  :root {
    --wm-size: 16%;      /* width of the logo relative to the player */
    --wm-opacity: .3;    /* 30% */
    --bg: #09080a;
    --gold: #d4af37;
    --line: #2b262d;
    --w: min(100%, calc((100dvh - 150px) * 16 / 9));   /* player width, keeps 16:9 inside the screen */
  }
  /* --------------------------------------------------- */

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); font-family: Barlow, system-ui, sans-serif; }
  body { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; gap: 10px; }

  /* Player = video + marquee. This is what goes fullscreen, so both stay visible. */
  .player { width: var(--w); background: #000; border: 1px solid var(--line); display: flex; flex-direction: column; }
  .player:fullscreen, .player.pseudo-fs { width: 100vw; height: 100dvh; border: 0; }
  .player.pseudo-fs { position: fixed; inset: 0; z-index: 999; }

  .stage { position: relative; overflow: hidden; background: #000; width: 100%; aspect-ratio: 16 / 9; }
  .player:fullscreen .stage, .player.pseudo-fs .stage { aspect-ratio: auto; flex: 1 1 auto; min-height: 0; }

  /* Whatever iframe you paste fills the stage */
  .stage iframe { position: absolute; inset: 0; width: 100% !important; height: 100% !important; border: 0 !important; }

  .wm {
    position: absolute; z-index: 5; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: var(--wm-size); height: auto; opacity: var(--wm-opacity);
    pointer-events: none; user-select: none; -webkit-user-drag: none;
  }

  /* WhatsApp channel marquee */
  .marquee { flex: none; overflow: hidden; background: #0d0c0f; border-top: 1px solid var(--line); height: 38px; display: flex; align-items: center; }
  .track { display: inline-flex; white-space: nowrap; animation: scroll 32s linear infinite; will-change: transform; }
  .marquee:hover .track { animation-play-state: paused; }
  .track a { color: var(--gold); text-decoration: none; font: 600 14px Barlow, sans-serif; letter-spacing: .02em; padding: 0 28px; }
  .track a:hover { text-decoration: underline; }
  .track a::after { content: "\25C6"; margin-left: 56px; color: var(--line); }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .track { animation: none; } }

  button { font: 500 14px Barlow, sans-serif; color: #ece6d6; background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 8px 16px; cursor: pointer; }
  button:hover { border-color: var(--gold); color: var(--gold); }
  button:focus-visible, .track a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>

<div class="player" id="player">
  <div class="stage" id="stage">

    <!-- ============ PASTE YOUR IFRAME BELOW THIS LINE ============ -->
<iframe src="https://dlive.sx/cast/stream-78.php" width="100%" height="100%" style="border:0;" allowfullscreen></iframe>
    <!-- ============ PASTE YOUR IFRAME ABOVE THIS LINE ============ -->

    <img class="wm" src="https://i.ibb.co/fYfDkpyz/file-00000000b894820a90c1d95f7fe249f4.png" alt="" draggable="false" onerror="this.remove()">
  </div>

  <div class="marquee" aria-label="WhatsApp channel"><div class="track" id="track"></div></div>
</div>

<button id="fsBtn" type="button">Fullscreen</button>

<script>
  /* ---------- Edit these ---------- */
  const CHANNEL_URL  = "https://whatsapp.com/channel/0029VaEQJcJEVccLFGqfTo0w";
  const CHANNEL_TEXT = "Join our WhatsApp channel for live updates";

  /* true  = the player's own fullscreen button is disabled, so viewers use the Fullscreen button below
             and your logo + marquee always stay visible.
     false = leave the player's own fullscreen alone (logo and marquee disappear when it is used). */
  const LOCK_FULLSCREEN = true;
  /* -------------------------------- */

  const player = document.getElementById("player");
  const stage  = document.getElementById("stage");
  const fsBtn  = document.getElementById("fsBtn");

  /* Build the marquee: two identical halves so the loop is seamless */
  const track = document.getElementById("track");
  for (let half = 0; half < 2; half++) {
    for (let i = 0; i < 6; i++) {
      const a = document.createElement("a");
      a.href = CHANNEL_URL; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = CHANNEL_TEXT;
      if (half) a.setAttribute("aria-hidden", "true"), a.tabIndex = -1;
      track.appendChild(a);
    }
  }

  if (LOCK_FULLSCREEN) {
    stage.querySelectorAll("iframe").forEach(f => {
      f.removeAttribute("allowfullscreen");
      f.removeAttribute("webkitallowfullscreen");
      f.removeAttribute("mozallowfullscreen");
    });
  }
  stage.querySelectorAll("iframe").forEach(f => f.setAttribute("allow", "autoplay; encrypted-media; picture-in-picture"));

  const inFs = () => document.fullscreenElement === player || player.classList.contains("pseudo-fs");
  function syncLabel() { fsBtn.textContent = inFs() ? "Exit fullscreen" : "Fullscreen"; }
  function toggleFs() {
    if (inFs()) {
      if (document.fullscreenElement) document.exitFullscreen();
      player.classList.remove("pseudo-fs");
    } else if (player.requestFullscreen) {
      player.requestFullscreen().catch(() => player.classList.add("pseudo-fs"));
    } else {
      player.classList.add("pseudo-fs");   // iPhone Safari fallback
    }
    setTimeout(syncLabel, 50);
  }
  fsBtn.addEventListener("click", toggleFs);
  stage.addEventListener("dblclick", toggleFs);
  document.addEventListener("fullscreenchange", syncLabel);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && player.classList.contains("pseudo-fs")) { player.classList.remove("pseudo-fs"); syncLabel(); }
  });
</script>
</body>
</html>
