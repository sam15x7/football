  <style>
    :root {
      color-scheme: dark;
      /* Studio Token System */
      --bg-deck: #050507;
      --bg-bay: #0b0b0f;
      --surface-glass: rgba(24, 24, 30, 0.64);
      --surface-glass-Subtle: rgba(20, 20, 26, 0.52);
      --surface-hover: rgba(38, 38, 48, 0.78);
      --surface-active: rgba(50, 50, 62, 0.88);
      --surface-docked: rgba(16, 16, 22, 0.84);

      --gold: #d4af37;
      --gold-hi: #f6e294;
      --gold-lo: #9e7b1c;
      --gold-surface: rgba(212, 175, 55, 0.14);
      --gold-border: rgba(212, 175, 55, 0.42);
      --live-green: #30d158;

      --specular-top: rgba(255, 255, 255, 0.16);
      --border-hairline: rgba(255, 255, 255, 0.085);
      --border-strong: rgba(255, 255, 255, 0.16);

      --text-primary: #f5f5f7;
      --text-secondary: rgba(235, 235, 245, 0.66);
      --text-tertiary: rgba(235, 235, 245, 0.42);

      --font-display: 'Barlow Condensed', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', ui-monospace, SFMono-Regular, monospace;

      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      -webkit-tap-highlight-color: transparent;
    }

    [hidden] {
      display: none !important;
    }

    html {
      background: var(--bg-deck);
      font: 100%/1.5 var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
      background: var(--bg-deck);
      color: var(--text-primary);
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* High-visibility focus ring (Priority 1 Accessibility & HIG) */
    :focus-visible {
      outline: 2px solid var(--gold-hi);
      outline-offset: 3px;
    }

    /* ==========================================================================
     * 1. @asset-animate Backdrop: Ken Burns Aura + Ambient Bokeh Particles
     * ========================================================================== */
    #backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .ken-burns-stage {
      position: absolute;
      inset: -10%;
      background:
        radial-gradient(52rem 32rem at 50% 12%, rgba(212, 175, 55, 0.16), transparent 68%),
        radial-gradient(38rem 26rem at 22% 28%, rgba(246, 226, 148, 0.06), transparent 65%),
        radial-gradient(42rem 30rem at 78% 24%, rgba(212, 175, 55, 0.07), transparent 65%);
      animation: ken-burns 15s ease-in-out infinite alternate;
      will-change: transform;
    }

    #fx {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 24%, transparent 38%, rgba(5, 5, 7, 0.86) 100%),
        linear-gradient(180deg, rgba(5, 5, 7, 0.15) 0%, rgba(5, 5, 7, 0.92) 100%);
    }

    .page {
      position: relative;
      z-index: 1;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* ==========================================================================
     * 2. Hero + 3-Layer Parallax & Breathing/Floating Emblem (@asset-animate)
     * ========================================================================== */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: max(3rem, calc(env(safe-area-inset-top) + 1.75rem)) 1.25rem 0;
    }

    .telemetry-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3125rem 0.75rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--border-hairline);
      border-top-color: var(--specular-top);
      font: 600 0.72rem/1 var(--font-mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold-hi);
      margin-bottom: 1.35rem;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }

    .live-dot {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: var(--live-green);
      box-shadow: 0 0 10px var(--live-green);
      animation: live-pulse 2.4s ease-in-out infinite;
    }

    .emblem {
      --e: clamp(6.75rem, 15vw, 9.5rem);
      --px-bg: 0px;
      --py-bg: 0px;
      --px-mid: 0px;
      --py-mid: 0px;
      --px-fg: 0px;
      --py-fg: 0px;
      position: relative;
      width: var(--e);
      height: var(--e);
      display: grid;
      place-items: center;
      border-radius: 30%;
      background:
        radial-gradient(circle at 50% 22%, rgba(255, 255, 255, 0.12), rgba(20, 20, 26, 0.72));
      border: 1px solid var(--border-strong);
      box-shadow:
        inset 0 1px 0 var(--specular-top),
        0 24px 48px -12px rgba(0, 0, 0, 0.82),
        0 0 42px -8px rgba(212, 175, 55, 0.24);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      backdrop-filter: blur(22px) saturate(180%);
      cursor: grab;
      touch-action: none;
      user-select: none;
      will-change: transform;
    }

    .emblem:active {
      cursor: grabbing;
    }

    /* Parallax Layer 1: Background Halo (-10% depth) */
    .emblem .halo {
      position: absolute;
      inset: -32%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.28), transparent 66%);
      transform: translate3d(var(--px-bg), var(--py-bg), 0);
      pointer-events: none;
      will-change: transform;
    }

    /* Parallax Layer 2: Midground Broadcast Bezel Rings (-20% depth) */
    .emblem .ring {
      position: absolute;
      border-radius: inherit;
      pointer-events: none;
      transform: translate3d(var(--px-mid), var(--py-mid), 0);
      will-change: transform;
    }

    .emblem .ring.base {
      inset: -1px;
      border: 1px solid rgba(212, 175, 55, 0.34);
    }

    .emblem .ring.dash {
      inset: -10px;
      border-radius: 33%;
      border: 1px dashed rgba(212, 175, 55, 0.22);
    }

    /* Parallax Layer 3: Foreground Still Image with Float + Breathe (@asset-animate) */
    .emblem .parallax {
      width: 74%;
      height: 74%;
      display: grid;
      place-items: center;
      transform: translate3d(var(--px-fg), var(--py-fg), 0);
      pointer-events: none;
      will-change: transform;
    }

    .emblem .float-wrap {
      width: 100%;
      height: 100%;
      animation: float-levitate 4.5s ease-in-out infinite;
      will-change: transform;
    }

    .emblem .logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 18px rgba(212, 175, 55, 0.32));
      animation: breathe-life 6s ease-in-out infinite;
      will-change: transform;
    }

    .nologo .emblem,
    .nologo .mini {
      display: none !important;
    }

    .hero h1 {
      margin-top: clamp(1.35rem, 3.2vh, 2rem);
      font: 800 clamp(3rem, 8.2vw, 5.75rem)/0.94 var(--font-display);
      letter-spacing: 0.015em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #f7e7aa 54%, var(--gold) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    .hero .tag {
      margin-top: 0.625rem;
      color: var(--text-secondary);
      font-size: clamp(0.96875rem, 1.6vw, 1.125rem);
      font-weight: 400;
      max-width: 38ch;
      letter-spacing: -0.006em;
    }

    /* ==========================================================================
     * 3. Sticky Liquid Glass Command Bar & HIG Action Buttons
     * ========================================================================== */
    .chrome-deck {
      position: sticky;
      top: 0;
      z-index: 20;
      margin-top: 1.625rem;
      padding: max(0.625rem, env(safe-area-inset-top)) 1rem 0.625rem;
      pointer-events: none;
    }

    /* Scroll-edge soft gradient mask instead of hard divider */
    .chrome-deck::before {
      content: "";
      position: absolute;
      inset: 0 0 -1.5rem 0;
      background: linear-gradient(180deg, rgba(5, 5, 7, 0.86) 0%, rgba(5, 5, 7, 0.48) 58%, transparent 100%);
      opacity: 0;
      transition: opacity 220ms ease;
      pointer-events: none;
      z-index: -1;
    }

    .chrome-deck.docked::before {
      opacity: 1;
    }

    .bar-shell {
      pointer-events: auto;
      max-width: 68rem;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      width: 100%;
    }

    .bar {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 3.125rem;
      padding: 0.25rem 0.625rem 0.25rem 0.75rem;
      border-radius: 999px;
      background: var(--surface-glass);
      border: 1px solid var(--border-hairline);
      border-top-color: var(--specular-top);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      backdrop-filter: blur(24px) saturate(190%);
      box-shadow: 0 10px 28px -10px rgba(0, 0, 0, 0.55);
      transition:
        background-color 200ms ease,
        border-color 200ms ease,
        box-shadow 240ms ease;
    }

    .bar:focus-within {
      border-color: var(--gold-border);
      box-shadow:
        0 0 0 3.5px rgba(212, 175, 55, 0.18),
        0 14px 34px -10px rgba(0, 0, 0, 0.75);
    }

    .chrome-deck.docked .bar {
      background: var(--surface-docked);
      box-shadow: 0 18px 42px -12px rgba(0, 0, 0, 0.85);
    }

    /* HIG Button: Back to top mini logo (44x44px hit target) */
    .mini {
      flex: none;
      width: 0;
      height: 2.75rem;
      margin-right: -0.5rem;
      padding: 0;
      overflow: hidden;
      background: transparent;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      opacity: 0;
      transform: scale(0.6);
      filter: blur(6px);
      pointer-events: none;
      transition:
        width 300ms var(--ease-spring),
        margin 300ms var(--ease-spring),
        opacity 220ms ease,
        transform 300ms var(--ease-spring),
        filter 220ms ease;
    }

    .chrome-deck.docked .mini {
      width: 2.75rem;
      margin-right: 0;
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
      pointer-events: auto;
    }

    .mini:active {
      transform: scale(0.92) !important;
      transition-duration: 80ms;
    }

    .mini-inner {
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border-hairline);
      display: grid;
      place-items: center;
      padding: 0.25rem;
    }

    .mini img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .field {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 0.625rem;
    }

    .field-icon {
      width: 1.125rem;
      height: 1.125rem;
      flex: none;
      fill: none;
      stroke: var(--text-secondary);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .field input {
      flex: 1;
      min-width: 0;
      height: 2.625rem;
      padding: 0;
      background: none;
      border: 0;
      color: var(--text-primary);
      font: 500 0.96875rem/1.3 var(--font-sans);
      letter-spacing: -0.008em;
    }

    .field input:focus {
      outline: none;
    }

    .field input::placeholder {
      color: var(--text-secondary);
      font-weight: 400;
    }

    .field input::-webkit-search-cancel-button {
      display: none;
    }

    /* HIG Clear Search Button: 44x44px hit target wrapping 22x22px visual circle */
    .clear-btn {
      position: relative;
      flex: none;
      width: 2.75rem;
      height: 2.75rem;
      border: 0;
      background: transparent;
      color: var(--text-primary);
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
      opacity: 0;
      transform: scale(0.75);
      pointer-events: none;
      transition: opacity 150ms ease, transform 200ms var(--ease-spring);
    }

    .clear-btn.visible {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .clear-btn-glyph {
      width: 1.375rem;
      height: 1.375rem;
      border-radius: 50%;
      background: rgba(235, 235, 245, 0.2);
      display: grid;
      place-items: center;
      transition: background-color 120ms ease, transform 100ms ease;
    }

    .clear-btn:hover .clear-btn-glyph {
      background: rgba(235, 235, 245, 0.3);
    }

    .clear-btn:active .clear-btn-glyph {
      transform: scale(0.9);
      background: rgba(235, 235, 245, 0.38);
    }

    .clear-btn svg {
      width: 0.75rem;
      height: 0.75rem;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
    }

    .kbd-hint {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.5rem;
      height: 1.5rem;
      padding: 0 0.375rem;
      border-radius: 0.375rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-hairline);
      font: 500 0.72rem/1 var(--font-mono);
      color: var(--text-tertiary);
    }

    .bar:focus-within .kbd-hint {
      display: none;
    }

    .count {
      flex: none;
      font: 600 0.75rem/1 var(--font-mono);
      letter-spacing: 0.02em;
      color: var(--text-secondary);
      padding: 0.4375rem 0.6875rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.055);
      white-space: nowrap;
    }

    /* HIG Prominent Action Button: "Tune Random" (min 44px height, explicit verb label) */
    .action-btn {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 3.125rem;
      padding: 0 1.0625rem;
      border-radius: 999px;
      border: 1px solid var(--gold-border);
      border-top-color: rgba(246, 226, 148, 0.55);
      background:
        linear-gradient(180deg, rgba(212, 175, 55, 0.24) 0%, rgba(212, 175, 55, 0.12) 100%),
        var(--surface-glass);
      color: var(--gold-hi);
      font: 600 0.875rem/1 var(--font-sans);
      letter-spacing: -0.005em;
      cursor: pointer;
      white-space: nowrap;
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      backdrop-filter: blur(24px) saturate(180%);
      box-shadow: 0 10px 26px -10px rgba(0, 0, 0, 0.55);
      transition:
        transform 120ms ease-out,
        background-color 180ms ease,
        border-color 180ms ease,
        box-shadow 200ms ease;
    }

    .action-btn svg {
      width: 1rem;
      height: 1rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (hover: hover) and (pointer: fine) {
      .action-btn:hover {
        background-color: rgba(212, 175, 55, 0.22);
        border-color: var(--gold-hi);
        box-shadow: 0 12px 28px -8px rgba(212, 175, 55, 0.26);
      }
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    /* ---------- Secondary Filter & View Switcher Row (Apple Segmented Controls) ---------- */
    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .region-track {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 0.375rem;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0.125rem 0;
    }

    .region-track::-webkit-scrollbar {
      display: none;
    }

    /* HIG Segmented Pill Buttons: 44px touch height */
    .seg-pill {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      min-height: 2.75rem;
      padding: 0 0.875rem;
      border-radius: 999px;
      border: 1px solid var(--border-hairline);
      background: var(--surface-glass-Subtle);
      color: var(--text-secondary);
      font: 600 0.8125rem/1 var(--font-sans);
      cursor: pointer;
      white-space: nowrap;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      transition:
        transform 100ms ease-out,
        background-color 160ms ease,
        color 160ms ease,
        border-color 160ms ease;
    }

    .seg-pill:hover {
      color: var(--text-primary);
      background: var(--surface-hover);
    }

    .seg-pill:active {
      transform: scale(0.96);
    }

    .seg-pill[aria-pressed="true"] {
      background: rgba(212, 175, 55, 0.18);
      border-color: var(--gold-border);
      color: var(--gold-hi);
      box-shadow: inset 0 1px 0 rgba(246, 226, 148, 0.25);
    }

    .seg-pill-count {
      font: 500 0.6875rem/1 var(--font-mono);
      opacity: 0.72;
    }

    .view-toggle {
      flex: none;
      display: inline-flex;
      align-items: center;
      padding: 0.1875rem;
      border-radius: 999px;
      background: var(--surface-glass-Subtle);
      border: 1px solid var(--border-hairline);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }

    .view-btn {
      width: 2.5rem;
      height: 2.375rem;
      border-radius: 999px;
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background-color 150ms ease, color 150ms ease, transform 100ms ease;
    }

    .view-btn:active {
      transform: scale(0.92);
    }

    .view-btn[aria-pressed="true"] {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-primary);
    }

    .view-btn svg {
      width: 1rem;
      height: 1rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

     * 4. Channel Cards (<nav class="grid" id="channels">

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var links = Array.prototype.slice.call(document.querySelectorAll('#channels a'));
  var countEl = $('#count'), emptyEl = $('#empty'), queryEl = $('#q'), clearBtn = $('#clearBtn');
  var chromeDeck = $('#chromeDeck'), nav = $('#channels'), emblem = $('#emblem');
  var regionTrack = $('#regionTrack'), randomBtn = $('#randomBtn'), resetBtn = $('#resetBtn');
  var gridViewBtn = $('#gridViewBtn'), listViewBtn = $('#listViewBtn');
  var filterRowEl = document.querySelector('.filter-row');
  var emptyDescEl = $('#emptyDesc');

  var mqlReduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  var REDUCED = mqlReduced.matches;
  mqlReduced.addEventListener('change', function (e) { REDUCED = e.matches; });

  /* ==========================================================================
   * 1. Progressive Channel Metadata & Saved Pins Enrichment
   *    (Leaves original HTML <a> list untouched in source for backend scripts)
   * ========================================================================== */
  var STORAGE_KEY = 'predictor_pinned_channels_v1';
  var pinnedSet = new Set();
  try {
    var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    if (Array.isArray(saved)) saved.forEach(function (h) { pinnedSet.add(h); });
  } catch (e) {}

  function savePins() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(pinnedSet)));
    } catch (e) {}
  }

  function detectRegion(name, href) {
    var s = (name + ' ' + href).toLowerCase();
    if (/\b(uk|ireland|itv|skysportsf1uk|laligatvuk|viaplaysports2uk)\b/.test(s)) return { id: 'uk', code: 'UK & IE', group: 'UK & IE' };
    if (/\b(usa|espn2usa|espnu|espnusa|fox|appletv)\b/.test(s)) return { id: 'usa', code: 'USA', group: 'USA' };
    if (/\b(mena|uae|abudhabi|israel|astro|sonyten)\b/.test(s)) return { id: 'mena', code: 'MENA & ASIA', group: 'MENA & Asia' };
    if (/\b(argentina|brasil|brazil|telefe|tyc|sportvbrasil)\b/.test(s)) return { id: 'latam', code: 'LATAM', group: 'Americas' };
    return { id: 'eur', code: 'EUROPE', group: 'Europe' };
  }

  /* ---------- Sport Tag Model (mirrors admin/lib.js SPORT_ALIASES) ---------- */
  var SPORT_ALIASES = {
    'soccer': 'football', 'association football': 'football',
    'basket': 'basketball', 'basket ball': 'basketball',
    'ice hockey': 'hockey',
    'auto racing': 'motorsport', 'motor racing': 'motorsport', 'racing': 'motorsport',
    'formula 1': 'f1', 'formula-one': 'f1',
    'american football': 'nfl', 'nfl football': 'nfl',
    'mixed martial arts': 'mma',
    'olympic sports': 'olympics',
    'sports': '', 'sport': ''
  };

  function normSportTag(raw) {
    var s0 = String(raw == null ? '' : raw).trim().toLowerCase().replace(/\s+/g, ' ');
    if (!s0) return '';
    return Object.prototype.hasOwnProperty.call(SPORT_ALIASES, s0) ? SPORT_ALIASES[s0] : s0;
  }

  // Read canonical sport tags from data-sport (generated from channels.json).
  function getSports(a) {
    var raw = a.getAttribute('data-sport') || '';
    var out = [];
    raw.split(/[,;]/).forEach(function (t) {
      var n = normSportTag(t);
      if (n && out.indexOf(n) === -1) out.push(n);
    });
    return out;
  }

  var SPORT_LABELS = {
    'football': 'Football', 'mls': 'MLS', 'college football': 'College FB', 'nfl': 'NFL',
    'basketball': 'Basketball', 'tennis': 'Tennis', 'cricket': 'Cricket', 'badminton': 'Badminton',
    'ufc': 'UFC', 'mma': 'MMA', 'boxing': 'Boxing', 'combat sports': 'Combat',
    'motorsport': 'Motorsport', 'f1': 'F1', 'nascar': 'NASCAR',
    'horse racing': 'Horse Racing', 'volleyball': 'Volleyball', 'hockey': 'Hockey',
    'handball': 'Handball', 'rugby': 'Rugby', 'cycling': 'Cycling', 'darts': 'Darts',
    'field hockey': 'Field Hockey', 'gaelic games': 'Gaelic', 'baseball': 'Baseball', 'mlb': 'MLB', 'olympics': 'Olympics'
  };

  function sportLabel(tag) {
    if (SPORT_LABELS[tag]) return SPORT_LABELS[tag];
    return tag.replace(/\b[a-z]/g, function (ch) { return ch.toUpperCase(); });
  }

  var activeSport = 'All';
  var allSportTags = [];
  links.forEach(function (a) {
    getSports(a).forEach(function (t) {
      if (allSportTags.indexOf(t) === -1) allSportTags.push(t);
    });
  });
  allSportTags.sort();
  var hasFootball = allSportTags.indexOf('football') > -1;

  links.forEach(function (a, idx) {
    var rawTitle = a.textContent.trim();
    var href = a.getAttribute('href') || '';
    var region = detectRegion(rawTitle, href);
    var sports = getSports(a);
    var num = String(idx + 1).padStart(2, '0');

    a.dataset.title = rawTitle;
    a.dataset.region = region.group;
    a.dataset.sports = sports.join(',');
    a.dataset.hay = (rawTitle + ' ' + href + ' ' + region.code + ' ch' + num + ' ' + sports.join(' ')).toLowerCase();

    var isPinned = pinnedSet.has(href);

    var tagChips = sports.map(function (t) {
      return '<span class="ch-tag' + (t === 'football' ? ' ch-tag-football' : '') + '">' +
             sportLabel(t).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</span>';
    }).join('');

    a.innerHTML =
      '<div class="ch-top">' +
        '<div class="ch-meta">' +
          '<span class="ch-num">CH ' + num + '</span>' +
          '<span class="ch-region">' + region.code + '</span>' +
        '</div>' +
        '<button type="button" class="pin-btn" aria-pressed="' + (isPinned ? 'true' : 'false') + '" aria-label="Pin ' + rawTitle.replace(/"/g, '&quot;') + '">' +
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>' +
        '</button>' +
      '</div>' +
      '<div class="ch-bottom">' +
        '<div class="ch-text">' +
          '<span class="ch-title"></span>' +
          (tagChips ? '<div class="ch-tags" role="list" aria-label="Sports">' + tagChips + '</div>' : '') +
        '</div>' +
        '<span class="ch-play" aria-hidden="true">' +
          '<svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>' +
        '</span>' +
      '</div>';

    a.querySelector('.ch-title').textContent = rawTitle;
  });

  /* ---------- Build Segmented Region Filter Bar ---------- */
  var activeRegion = 'All';
  var regionGroups = ['All', 'Pinned', 'UK & IE', 'USA', 'Europe', 'MENA & Asia', 'Americas'];

  function renderRegionPills() {
    regionTrack.innerHTML = '';
    regionGroups.forEach(function (group) {
      var count = 0;
      if (group === 'All') {
        count = links.length;
      } else if (group === 'Pinned') {
        count = links.filter(function (a) { return pinnedSet.has(a.getAttribute('href')); }).length;
        if (count === 0 && activeRegion !== 'Pinned') return;
      } else {
        count = links.filter(function (a) { return a.dataset.region === group; }).length;
      }

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'seg-pill';
      btn.setAttribute('aria-pressed', activeRegion === group ? 'true' : 'false');
      btn.innerHTML = '<span>' + group + '</span><span class="seg-pill-count">' + count + '</span>';
      btn.addEventListener('click', function () {
        activeRegion = group;
        renderRegionPills();
        applyFilter();
      });
      regionTrack.appendChild(btn);
    });
  }

  /* ---------- Build Segmented Sport Filter Bar (Football first) ---------- */
  var sportTrack = document.createElement('div');
  sportTrack.className = 'region-track sport-track';
  sportTrack.id = 'sportTrack';
  sportTrack.setAttribute('role', 'toolbar');
  sportTrack.setAttribute('aria-label', 'Filter channels by sport');
  if (filterRowEl && hasFootball) filterRowEl.parentNode.insertBefore(sportTrack, filterRowEl);

  function renderSportPills() {
    if (!hasFootball) return;
    sportTrack.innerHTML = '';
    var groups = ['All', 'Football'].concat(allSportTags.filter(function (t) { return t !== 'football'; }));
    groups.forEach(function (group) {
      var count;
      if (group === 'All') {
        count = links.length;
      } else if (group === 'Football') {
        count = links.filter(function (a) { return a.dataset.sports.indexOf('football') > -1; }).length;
      } else {
        count = links.filter(function (a) {
          return a.dataset.sports.split(',').indexOf(group) > -1;
        }).length;
      }
      if (!count && group !== 'All' && group !== 'Football') return;

      var btnId = 'sport-' + group.toLowerCase().replace(/[^a-z]+/g, '-');
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'seg-pill seg-pill-sport' + (group === 'Football' ? ' seg-pill-football' : '');
      btn.id = btnId;
      btn.setAttribute('aria-pressed', activeSport === group ? 'true' : 'false');
      btn.innerHTML = '<span>' + (group === 'All' ? 'All Sports' : (SPORT_LABELS[group] || group)) +
                      '</span><span class="seg-pill-count">' + count + '</span>';
      btn.addEventListener('click', function () {
        activeSport = group;
        renderSportPills();
        applyFilter();
      });
      sportTrack.appendChild(btn);
    });
  }

  /* ---------- Search + Region + Sport Filter ---------- */
  function applyFilter() {
    var raw = queryEl.value;
    var terms = raw.trim().toLowerCase().split(/\s+/).filter(Boolean);
    var visible = 0;

    links.forEach(function (a) {
      var href = a.getAttribute('href');
      var regionMatch =
        activeRegion === 'All' ||
        (activeRegion === 'Pinned' && pinnedSet.has(href)) ||
        a.dataset.region === activeRegion;

      var sportsList = a.dataset.sports ? a.dataset.sports.split(',') : [];
      var sportMatch =
        !hasFootball ||
        activeSport === 'All' ||
        (activeSport === 'Football' ? sportsList.indexOf('football') > -1 : sportsList.indexOf(activeSport) > -1);

      var hay = a.dataset.hay;
      var flat = hay.replace(/\s+/g, '');
      var textMatch = terms.every(function (t) { return hay.indexOf(t) > -1 || flat.indexOf(t) > -1; });

      var ok = regionMatch && sportMatch && textMatch;
      a.classList.toggle('hidden', !ok);
      if (ok) visible++;
    });

    countEl.textContent = (terms.length || activeRegion !== 'All' || activeSport !== 'All')
      ? visible + ' of ' + links.length
      : links.length + ' live';
    clearBtn.classList.toggle('visible', raw.length > 0);
    emptyEl.hidden = visible !== 0;
    emptyDescEl.textContent = (hasFootball && activeSport !== 'All')
      ? 'No channels carry the "' + (SPORT_LABELS[activeSport] || activeSport) + '" tag right now. Try another sport or switch back to All Sports.'
      : 'Try a broader channel name or switch back to all regions.';
  }

  renderRegionPills();
  renderSportPills();
  applyFilter();

  queryEl.addEventListener('input', applyFilter);

  clearBtn.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    queryEl.value = '';
    applyFilter();
    queryEl.focus();
  });

  resetBtn.addEventListener('click', function () {
    queryEl.value = '';
    activeRegion = 'All';
    activeSport = 'All';
    renderRegionPills();
    renderSportPills();
    applyFilter();
    queryEl.focus();
  });

  /* ---------- Pin Button Handler inside Channel Cards ---------- */
  nav.addEventListener('click', function (e) {
    var pinBtn = e.target.closest('.pin-btn');
    if (!pinBtn) return;
    e.preventDefault();
    e.stopPropagation();
    var a = pinBtn.closest('a');
    if (!a) return;
    var href = a.getAttribute('href');
    if (pinnedSet.has(href)) {
      pinnedSet.delete(href);
      pinBtn.setAttribute('aria-pressed', 'false');
    } else {
      pinnedSet.add(href);
      pinBtn.setAttribute('aria-pressed', 'true');
    }
    savePins();
    if (activeRegion === 'Pinned' && pinnedSet.size === 0) {
      activeRegion = 'All';
    }
    renderRegionPills();
    applyFilter();
  });

  /* ---------- Tune Random Channel Action Button ---------- */
  randomBtn.addEventListener('click', function () {
    var pool = links.filter(function (a) { return !a.classList.contains('hidden'); });
    if (!pool.length) pool = links;
    var pick = pool[Math.floor(Math.random() * pool.length)];
    if (pick) window.location.href = pick.getAttribute('href');
  });

  /* ---------- Layout View Switcher (Grid vs Compact) ---------- */
  function setViewMode(compact) {
    nav.classList.toggle('compact-view', compact);
    gridViewBtn.setAttribute('aria-pressed', compact ? 'false' : 'true');
    listViewBtn.setAttribute('aria-pressed', compact ? 'true' : 'false');
  }
  gridViewBtn.addEventListener('click', function () { setViewMode(false); });
  listViewBtn.addEventListener('click', function () { setViewMode(true); });

  /* ---------- Sticky Bar Docking Observer ---------- */
  if ('IntersectionObserver' in window && emblem) {
    new IntersectionObserver(function (entries) {
      chromeDeck.classList.toggle('docked', !entries[0].isIntersecting);
    }, { threshold: 0 }).observe(emblem);
  }

  $('#top').addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
  });

  /* ==========================================================================
   * 2. Apple Fluid Spring Physics + @asset-animate 3-Layer Parallax
   * ========================================================================== */
  function rubberband(overshoot, dimension, constant) {
    if (constant === undefined) constant = 0.55;
    var sign = overshoot < 0 ? -1 : 1;
    var abs = Math.abs(overshoot);
    return sign * (abs * dimension * constant) / (dimension + constant * abs);
  }

  function createSpring(initialValue, dampingRatio, response) {
    return {
      value: initialValue || 0,
      target: initialValue || 0,
      velocity: 0,
      damping: dampingRatio !== undefined ? dampingRatio : 1.0,
      response: response !== undefined ? response : 0.35
    };
  }

  function stepSpring(s, dt) {
    var omega = (2 * Math.PI) / s.response;
    var stiffness = omega * omega;
    var dampingCoeff = 2 * s.damping * omega;
    var displacement = s.value - s.target;
    var accel = -stiffness * displacement - dampingCoeff * s.velocity;
    s.velocity += accel * dt;
    s.value += s.velocity * dt;
    if (Math.abs(s.value - s.target) < 0.05 && Math.abs(s.velocity) < 0.5) {
      s.value = s.target;
      s.velocity = 0;
      return false;
    }
    return true;
  }

  /* ---------- Hero Emblem 1:1 Drag + 3-Layer Depth Parallax ---------- */
  if (emblem) {
    var emX = createSpring(0, 1.0, 0.38);
    var emY = createSpring(0, 1.0, 0.38);
    var emScale = createSpring(1, 1.0, 0.24);
    var emRaf = 0;
    var draggingEmblem = false;
    var grabOffsetX = 0, grabOffsetY = 0;
    var history = [];

    function renderEmblem() {
      emblem.style.transform =
        'translate3d(' + emX.value.toFixed(2) + 'px,' + emY.value.toFixed(2) + 'px,0) scale(' + emScale.value.toFixed(4) + ')';
    }

    function tickEmblem() {
      var dt = 1 / 60;
      var activeX = draggingEmblem ? false : stepSpring(emX, dt);
      var activeY = draggingEmblem ? false : stepSpring(emY, dt);
      var activeS = stepSpring(emScale, dt);
      renderEmblem();
      if (activeX || activeY || activeS || draggingEmblem) {
        emRaf = requestAnimationFrame(tickEmblem);
      } else {
        emRaf = 0;
      }
    }

    function ensureEmblemLoop() {
      if (!emRaf && !REDUCED) emRaf = requestAnimationFrame(tickEmblem);
    }

    emblem.addEventListener('pointerdown', function (e) {
      if (REDUCED) return;
      emblem.setPointerCapture(e.pointerId);
      draggingEmblem = true;
      grabOffsetX = e.clientX - emX.value;
      grabOffsetY = e.clientY - emY.value;
      emX.velocity = 0;
      emY.velocity = 0;
      emScale.damping = 1.0;
      emScale.response = 0.2;
      emScale.target = 0.94;
      history = [{ x: emX.value, y: emY.value, t: performance.now() }];
      ensureEmblemLoop();
    });

    emblem.addEventListener('pointermove', function (e) {
      if (!draggingEmblem || REDUCED) return;
      emX.value = rubberband(e.clientX - grabOffsetX, 92, 0.55);
      emY.value = rubberband(e.clientY - grabOffsetY, 92, 0.55);
      var now = performance.now();
      history.push({ x: emX.value, y: emY.value, t: now });
      while (history.length > 5 && now - history[0].t > 100) history.shift();
      renderEmblem();
    });

    function releaseEmblem() {
      if (!draggingEmblem) return;
      draggingEmblem = false;
      var now = performance.now();
      var vx = 0, vy = 0;
      if (history.length >= 2) {
        var first = history[0];
        var last = history[history.length - 1];
        var elapsed = (now - first.t) / 1000;
        if (elapsed > 0.004 && now - last.t < 120) {
          vx = (last.x - first.x) / elapsed;
          vy = (last.y - first.y) / elapsed;
        }
      }
      var speed = Math.hypot(vx, vy);
      var damping = speed > 180 ? 0.76 : 1.0;
      emX.damping = damping;
      emY.damping = damping;
      emX.response = 0.42;
      emY.response = 0.42;
      emX.velocity = vx;
      emY.velocity = vy;
      emX.target = 0;
      emY.target = 0;

      emScale.damping = 0.85;
      emScale.response = 0.3;
      emScale.target = 1;
      ensureEmblemLoop();
    }

    emblem.addEventListener('pointerup', releaseEmblem);
    emblem.addEventListener('pointercancel', releaseEmblem);

    /* 3-Layer Parallax on Pointer Move (@asset-animate: -10%, -20%, -30% depth ratios) */
    window.addEventListener('pointermove', function (e) {
      if (e.pointerType !== 'mouse' || REDUCED || draggingEmblem) return;
      var nx = (e.clientX / window.innerWidth) * 2 - 1;
      var ny = (e.clientY / window.innerHeight) * 2 - 1;
      emblem.style.setProperty('--px-bg', (-nx * 4).toFixed(2) + 'px');
      emblem.style.setProperty('--py-bg', (-ny * 4).toFixed(2) + 'px');
      emblem.style.setProperty('--px-mid', (-nx * 8).toFixed(2) + 'px');
      emblem.style.setProperty('--py-mid', (-ny * 7).toFixed(2) + 'px');
      emblem.style.setProperty('--px-fg', (-nx * 13).toFixed(2) + 'px');
      emblem.style.setProperty('--py-fg', (-ny * 10).toFixed(2) + 'px');
    });
  }

  /* ---------- Channel Cards: Instant Pointer-Down Response & Spring Tracking ---------- */
  var cardStates = new WeakMap();
  var activeCards = new Set();
  var cardRaf = 0;

  function getCardState(a) {
    var st = cardStates.get(a);
    if (!st) {
      st = {
        x: createSpring(0, 1.0, 0.32),
        y: createSpring(0, 1.0, 0.32),
        scale: createSpring(1, 1.0, 0.2),
        spotA: createSpring(0, 1.0, 0.26),
        downX: 0,
        downY: 0,
        pressed: false
      };
      cardStates.set(a, st);
    }
    return st;
  }

  function tickCards() {
    var dt = 1 / 60;
    activeCards.forEach(function (a) {
      var st = getCardState(a);
      var mx = stepSpring(st.x, dt);
      var my = stepSpring(st.y, dt);
      var ms = stepSpring(st.scale, dt);
      var ma = stepSpring(st.spotA, dt);

      a.style.setProperty('--tx', st.x.value.toFixed(2) + 'px');
      a.style.setProperty('--ty', st.y.value.toFixed(2) + 'px');
      a.style.setProperty('--sc', st.scale.value.toFixed(4));
      a.style.setProperty('--spot-a', st.spotA.value.toFixed(3));

      if (!mx && !my && !ms && !ma && !st.pressed) {
        activeCards.delete(a);
      }
    });
    if (activeCards.size > 0) {
      cardRaf = requestAnimationFrame(tickCards);
    } else {
      cardRaf = 0;
    }
  }

  function wakeCard(a) {
    if (REDUCED) return;
    activeCards.add(a);
    if (!cardRaf) cardRaf = requestAnimationFrame(tickCards);
  }

  nav.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.pin-btn')) return;
    var a = e.target.closest('a');
    if (!a) return;
    a.classList.add('is-pressed');
    if (REDUCED) return;
    var st = getCardState(a);
    st.pressed = true;
    st.downX = e.clientX;
    st.downY = e.clientY;
    st.scale.damping = 1.0;
    st.scale.response = 0.16;
    st.scale.target = 0.968;
    st.spotA.target = 1;
    wakeCard(a);
  });

  nav.addEventListener('pointermove', function (e) {
    if (REDUCED) return;
    var a = e.target.closest('a');
    if (!a) return;
    var r = a.getBoundingClientRect();
    var relX = e.clientX - r.left;
    var relY = e.clientY - r.top;
    a.style.setProperty('--spot-x', ((relX / r.width) * 100).toFixed(1) + '%');
    a.style.setProperty('--spot-y', ((relY / r.height) * 100).toFixed(1) + '%');

    var st = getCardState(a);
    st.spotA.target = 1;

    if (e.pointerType === 'mouse') {
      var cx = relX - r.width / 2;
      var cy = relY - r.height / 2;
      st.x.target = rubberband(cx * 0.07, 5, 0.55);
      st.y.target = rubberband(cy * 0.1, 4, 0.55);
      wakeCard(a);
    } else if (st.pressed) {
      if (Math.hypot(e.clientX - st.downX, e.clientY - st.downY) > 10) {
        st.pressed = false;
        a.classList.remove('is-pressed');
        st.scale.target = 1;
        st.spotA.target = 0;
        wakeCard(a);
      }
    }
  });

  function releaseCard(e) {
    var a = e.target.closest('a');
    if (!a) return;
    a.classList.remove('is-pressed');
    if (REDUCED) return;
    var st = getCardState(a);
    st.pressed = false;
    st.scale.damping = 0.88;
    st.scale.response = 0.26;
    st.scale.target = 1;
    if (e.type === 'pointerout' || e.type === 'pointercancel' || e.pointerType !== 'mouse') {
      st.x.target = 0;
      st.y.target = 0;
      st.spotA.target = 0;
    }
    wakeCard(a);
  }

  nav.addEventListener('pointerup', releaseCard);
  nav.addEventListener('pointercancel', releaseCard);
  nav.addEventListener('pointerout', function (e) {
    var a = e.target.closest('a');
    if (a && !a.contains(e.relatedTarget)) releaseCard(e);
  });

  /* ---------- Keyboard Shortcuts: "/" to search, "Esc" to clear ---------- */
  document.addEventListener('keydown', function (e) {
    var typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (e.key === '/' && !typing) {
      e.preventDefault();
      queryEl.focus();
    }
    if (e.key === 'Escape' && document.activeElement === queryEl) {
      queryEl.value = '';
      applyFilter();
      queryEl.blur();
    }
  });

  /* ==========================================================================
   * 3. @asset-animate Ambient Bokeh Particles Canvas (#fx)
   * ========================================================================== */
  var fx = $('#fx'), ctx = fx.getContext('2d');
  var W = 0, H = 0, particles = [], rafId = 0, running = false;

  function createParticle() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      size: 1 + Math.random() * 2.2,
      speedX: (Math.random() - 0.5) * 0.26,
      speedY: -0.08 - Math.random() * 0.22,
      opacity: 0.12 + Math.random() * 0.34,
      pulse: Math.random() * Math.PI * 2
    };
  }

  function resizeFx() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    fx.width = W * dpr;
    fx.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var count = Math.min(34, Math.max(14, Math.round((W * H) / 38000)));
    while (particles.length < count) particles.push(createParticle());
    particles.length = count;
  }

  function animateParticles() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.speedX;
      p.y += p.speedY;
      p.pulse += 0.018;

      if (p.x < -10) p.x = W + 10;
      if (p.x > W + 10) p.x = -10;
      if (p.y < -10) p.y = H + 10;
      if (p.y > H + 10) p.y = -10;

      var alpha = p.opacity * (0.5 + 0.5 * Math.sin(p.pulse));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = '#D4AF37';
      ctx.globalAlpha = alpha;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    rafId = requestAnimationFrame(animateParticles);
  }

  function startParticles() {
    if (running || REDUCED || document.hidden) return;
    running = true;
    rafId = requestAnimationFrame(animateParticles);
  }

  function stopParticles() {
    running = false;
    cancelAnimationFrame(rafId);
  }

  resizeFx();
  startParticles();
  window.addEventListener('resize', resizeFx);
  document.addEventListener('visibilitychange', function () {
    document.hidden ? stopParticles() : startParticles();
  });

  // Channels are managed from the backend only — see admin/README.md.
})();
</script>
</body>
</html>
